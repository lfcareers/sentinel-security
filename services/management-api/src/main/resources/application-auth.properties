spring.security.oauth2.client.registration.sentinel.client-id=${OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.sentinel.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.sentinel.scope=openid,profile,email
spring.security.oauth2.client.provider.sentinel.issuer-uri=${OIDC_ISSUER_URI}
sentinel.frontend-url=${SENTINEL_FRONTEND_URL:https://sentinel.loganfoster.net}
server.servlet.session.timeout=5m