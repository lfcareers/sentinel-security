spring.application.name=sentinel-management-api

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=sentinel-management-api
spring.kafka.consumer.auto-offset-reset=earliest

sentinel.kafka.enabled=${SENTINEL_KAFKA_ENABLED:true}

management.endpoints.web.exposure.include=health,info

sentinel.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}