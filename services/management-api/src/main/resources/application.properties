spring.application.name=sentinel-management-api

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=sentinel-management-api
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_SASL_USERNAME:}' password='${KAFKA_SASL_PASSWORD:}';

sentinel.kafka.enabled=${SENTINEL_KAFKA_ENABLED:true}

management.endpoints.web.exposure.include=health,info

sentinel.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

sentinel.ingest.key=${SENTINEL_INGEST_KEY}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
